<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2c">
  <title>Skylight — Weather</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #f3f6fb;
      --muted: #a9b8cb;
      --soft: #d7e0ec;
      --card: rgba(15, 29, 47, .72);
      --line: rgba(255,255,255,.1);
      --blue: #9bd5ff;
      --gold: #ffd58a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 18% 0%, #385d7e 0, transparent 38%),
                  linear-gradient(145deg, #16283d, #0b1524 62%, #101b2a);
    }
    button, input { font: inherit; }
    .page { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 42px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(145deg,#8bd8ff,#5895db); color: #10243a; font-size: 23px; box-shadow: 0 8px 24px #4e9ac74c; }
    h1 { margin: 0; font-size: 19px; letter-spacing: .16em; text-transform: uppercase; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .search { display: flex; gap: 8px; width: min(470px, 55%); }
    .search input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; outline: none; padding: 12px 14px; background: #0c1928b8; color: var(--ink); }
    .search input:focus { border-color: #85cfffaa; box-shadow: 0 0 0 3px #79c9ff20; }
    .button { border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; color: var(--ink); background: #ffffff10; cursor: pointer; transition: background .2s, transform .2s; }
    .button:hover { background: #ffffff1b; transform: translateY(-1px); }
    .button.primary { border-color: transparent; background: #a9dcff; color: #13283d; font-weight: 800; }
    .button.primary:hover { background: #c1e7ff; }
    .hero { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--card); box-shadow: 0 18px 48px #00000020; backdrop-filter: blur(12px); }
    .current { min-height: 280px; padding: 25px 28px; position: relative; overflow: hidden; }
    .current::after { content: ""; position: absolute; width: 300px; height: 300px; right: -80px; top: -110px; border-radius: 50%; background: radial-gradient(circle, #91d4ff18, transparent 68%); pointer-events: none; }
    .place-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .place { font-size: 21px; font-weight: 750; }
    .updated { color: var(--muted); font-size: 12px; }
    .current-main { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding-top: 27px; }
    .temperature { font-size: clamp(64px, 10vw, 104px); line-height: .95; letter-spacing: -.08em; font-weight: 750; }
    .condition { margin-top: 11px; color: var(--soft); font-size: 17px; }
    .feels { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .weather-icon { font-size: clamp(72px, 11vw, 112px); filter: drop-shadow(0 10px 24px #0003); margin-right: 15px; }
    .unit-row { display: flex; align-items: center; gap: 5px; }
    .unit-button { border: 0; border-radius: 7px; padding: 5px 8px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer; }
    .unit-button.active { background: #ffffff16; color: var(--ink); }
    .details { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: center; }
    .detail { padding: 13px; border-radius: 13px; background: #ffffff08; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 7px; font-size: 18px; font-weight: 750; }
    .section { margin-top: 19px; padding: 20px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    h2 { margin: 0; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
    .section-note { color: var(--muted); font-size: 11px; }
    .hourly { display: grid; grid-template-columns: repeat(12, minmax(70px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .hour { min-width: 70px; padding: 12px 8px; border-radius: 13px; background: #ffffff08; text-align: center; }
    .hour-time { color: var(--muted); font-size: 11px; }
    .hour-icon { margin: 11px 0 8px; font-size: 22px; }
    .hour-temp { font-weight: 750; font-size: 14px; }
    .hour-rain { margin-top: 7px; color: var(--blue); font-size: 10px; }
    .daily { display: grid; gap: 5px; }
    .day { display: grid; grid-template-columns: 1.2fr 44px 1.5fr 44px 65px; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 10px; }
    .day:nth-child(odd) { background: #ffffff07; }
    .day-name { font-size: 13px; font-weight: 650; }
    .day-icon { font-size: 19px; text-align: center; }
    .day-desc { color: var(--muted); font-size: 12px; }
    .range { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .range-track { height: 5px; min-width: 40px; flex: 1; border-radius: 99px; background: linear-gradient(90deg, #79caff, #ffd178); }
    .rain-chance { color: var(--blue); font-size: 11px; text-align: right; }
    #status { min-height: 20px; margin: 12px 3px 0; color: var(--muted); font-size: 12px; }
    #status.error { color: #ffaaa4; }
    .loading { opacity: .58; pointer-events: none; }
    footer { margin-top: 16px; color: #9cacc0; font-size: 11px; text-align: center; }
    footer a { color: #b7ddf6; }
    @media (max-width: 760px) {
      .page { width: min(100% - 22px, 600px); padding-top: 17px; }
      header { align-items: flex-start; flex-direction: column; }
      .search { width: 100%; }
      .hero { grid-template-columns: 1fr; }
      .current { min-height: 235px; padding: 20px; }
      .details { grid-template-columns: repeat(4, 1fr); padding: 12px; }
      .detail { padding: 10px; }
      .detail-value { font-size: 15px; }
      .section { padding: 15px; }
      .hourly { grid-template-columns: repeat(12, 72px); }
    }
    @media (max-width: 460px) {
      .details { grid-template-columns: 1fr 1fr; }
      .day { grid-template-columns: 1fr 30px 1fr 52px; gap: 7px; }
      .day-desc { display: none; }
      .range-track { min-width: 25px; }
      .rain-chance { font-size: 10px; }
      .current-main { padding-top: 20px; }
    }
  </style>
</head>
<body>
  <main class="page" id="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☀</div>
        <div><h1>Skylight</h1><div class="subtitle">Weather, at a glance</div></div>
      </div>
      <form class="search" id="search-form" role="search">
        <input id="city-input" type="search" placeholder="Search a city…" aria-label="Search city" value="San Francisco">
        <button class="button primary" type="submit">Search</button>
        <button class="button" type="button" id="locate" aria-label="Use my location" title="Use my location">◎</button>
      </form>
    </header>

    <div id="weather-content">
      <section class="hero" aria-label="Current weather">
        <div class="card current">
          <div class="place-line"><div class="place" id="place">Loading weather…</div><div class="updated" id="updated"></div></div>
          <div class="current-main">
            <div>
              <div class="temperature" id="temperature">--°</div>
              <div class="condition" id="condition">Getting the forecast</div>
              <div class="feels" id="feels">Feels like --°</div>
            </div>
            <div class="weather-icon" id="current-icon" aria-hidden="true">🌤️</div>
          </div>
        </div>
        <div class="card details" aria-label="Weather details">
          <div class="detail"><div class="detail-label">Humidity</div><div class="detail-value" id="humidity">--%</div></div>
          <div class="detail"><div class="detail-label">Wind</div><div class="detail-value" id="wind">--</div></div>
          <div class="detail"><div class="detail-label">Precipitation</div><div class="detail-value" id="precip">-- mm</div></div>
          <div class="detail"><div class="detail-label">Sunrise · sunset</div><div class="detail-value" id="sun">-- · --</div></div>
        </div>
      </section>

      <section class="card section" aria-label="Hourly forecast">
        <div class="section-head"><h2>Next 12 hours</h2><div class="section-note" id="timezone-note"></div></div>
        <div class="hourly" id="hourly"></div>
      </section>

      <section class="card section" aria-label="Seven day forecast">
        <div class="section-head"><h2>7-day forecast</h2><div class="unit-row" aria-label="Temperature units">
          <button class="unit-button active" type="button" data-unit="C">°C</button>
          <button class="unit-button" type="button" data-unit="F">°F</button>
        </div></div>
        <div class="daily" id="daily"></div>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <footer>Forecast data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · No API key required</footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const els = {
      app: $('app'), content: $('weather-content'), form: $('search-form'), input: $('city-input'),
      place: $('place'), updated: $('updated'), temperature: $('temperature'), condition: $('condition'),
      feels: $('feels'), icon: $('current-icon'), humidity: $('humidity'), wind: $('wind'),
      precip: $('precip'), sun: $('sun'), hourly: $('hourly'), daily: $('daily'), status: $('status'),
      timezone: $('timezone-note')
    };
    let unit = 'C';
    let lastWeather = null;
    let requestId = 0;

    function weatherInfo(code, isDay = 1) {
      if (code === 0) return { text: 'Clear sky', icon: isDay ? '☀️' : '🌙' };
      if (code === 1) return { text: 'Mostly clear', icon: isDay ? '🌤️' : '🌙' };
      if (code === 2) return { text: 'Partly cloudy', icon: '⛅' };
      if (code === 3) return { text: 'Overcast', icon: '☁️' };
      if ([45, 48].includes(code)) return { text: 'Foggy', icon: '🌫️' };
      if ([51, 53, 55, 56, 57].includes(code)) return { text: 'Drizzle', icon: '🌦️' };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: 'Rain', icon: '🌧️' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: 'Snow', icon: '🌨️' };
      if ([ thunder, thunderHeavy ].includes(code)) return { text: 'Thunderstorm', icon: '⛈️' };
      return { text: 'Variable conditions', icon: '🌥️' };
    }
    const thunder = 95, thunderHeavy = 96;

    function convertTemp(c) { return unit === 'C' ? c : c * 9 / 5 + 32; }
    function tempLabel(c) { return `${Math.round(convertTemp(c))}°`; }
    function windLabel(kmh) { return `${Math.round(unit === 'C' ? kmh : kmh * 0.621371)} ${unit === 'C' ? 'km/h' : 'mph'}`; }
    function formatClock(value) { return value ? value.slice(-5) : '--:--'; }
    function dayName(dateString, index) {
      if (index === 0) return 'Today';
      const [y, m, d] = dateString.split('-').map(Number);
      return new Intl.DateTimeFormat(undefined, { weekday: 'short' }).format(new Date(y, m - 1, d));
    }

    async function geocode(name, id) {
      const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
      url.search = new URLSearchParams({ name, count: '1', language: 'en', format: 'json' });
      const response = await fetch(url);
      if (!response.ok) throw new Error('Could not search for that location. Try another city.');
      const data = await response.json();
      if (id !== requestId) return null;
      if (!data.results?.length) throw new Error('No matching city found. Check the spelling and try again.');
      return data.results[0];
    }

    async function loadWeather(location, label = null) {
      const id = ++requestId;
      els.status.className = '';
      els.status.textContent = 'Loading forecast…';
      els.content.classList.add('loading');
      try {
        const params = new URLSearchParams({
          latitude: String(location.latitude), longitude: String(location.longitude),
          current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m',
          hourly: 'temperature_2m,precipitation_probability,weather_code',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max',
          timezone: 'auto', forecast_days: '7'
        });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('Weather service is unavailable right now. Please try again.');
        const data = await response.json();
        if (id !== requestId) return;
        lastWeather = { data, location, label };
        render(data, location, label);
        els.status.textContent = '';
      } catch (error) {
        if (id !== requestId) return;
        els.status.className = 'error';
        els.status.textContent = error.message || 'Could not load weather. Please try again.';
      } finally {
        if (id === requestId) els.content.classList.remove('loading');
      }
    }

    function render(data, location, customLabel) {
      const c = data.current;
      const info = weatherInfo(c.weather_code, c.is_day);
      const place = customLabel || [location.name, location.admin1, location.country].filter(Boolean).join(', ');
      els.place.textContent = place;
      els.updated.textContent = `Updated ${formatClock(c.time)}`;
      els.temperature.textContent = tempLabel(c.temperature_2m);
      els.condition.textContent = info.text;
      els.feels.textContent = `Feels like ${tempLabel(c.apparent_temperature)}`;
      els.icon.textContent = info.icon;
      els.humidity.textContent = `${c.relative_humidity_2m}%`;
      els.wind.textContent = windLabel(c.wind_speed_10m);
      els.precip.textContent = `${Number(c.precipitation).toFixed(1)} mm`;
      els.sun.textContent = `${formatClock(data.daily.sunrise[0])} · ${formatClock(data.daily.sunset[0])}`;
      els.timezone.textContent = data.timezone.replaceAll('_', ' ');

      const currentHour = data.hourly.time.findIndex(t => t >= c.time);
      const start = currentHour < 0 ? 0 : currentHour;
      els.hourly.replaceChildren();
      for (let i = start; i < Math.min(start + 12, data.hourly.time.length); i++) {
        const weather = weatherInfo(data.hourly.weather_code[i], 1);
        const article = document.createElement('article');
        article.className = 'hour';
        article.innerHTML = `<div class="hour-time">${i === start ? 'Now' : formatClock(data.hourly.time[i])}</div>
          <div class="hour-icon" aria-hidden="true">${weather.icon}</div>
          <div class="hour-temp">${tempLabel(data.hourly.temperature_2m[i])}</div>
          <div class="hour-rain">💧 ${data.hourly.precipitation_probability[i] ?? 0}%</div>`;
        els.hourly.append(article);
      }

      const lows = data.daily.temperature_2m_min;
      const highs = data.daily.temperature_2m_max;
      const minAll = Math.min(...lows), maxAll = Math.max(...highs), span = Math.max(1, maxAll - minAll);
      els.daily.replaceChildren();
      data.daily.time.forEach((date, i) => {
        const weather = weatherInfo(data.daily.weather_code[i]);
        const range = document.createElement('div');
        range.className = 'day';
        const left = ((lows[i] - minAll) / span) * 100;
        const width = Math.max(12, ((highs[i] - lows[i]) / span) * 100);
        range.innerHTML = `<div class="day-name">${dayName(date, i)}</div>
          <div class="day-icon" aria-label="${weather.text}">${weather.icon}</div>
          <div class="day-desc">${weather.text}</div>
          <div class="range"><span>${tempLabel(lows[i])}</span><span class="range-track" style="background:linear-gradient(90deg,#78c9ff,#ffd178);opacity:${Math.max(.55, width / 100)};transform:translateX(${Math.max(-15, left - 35)}%)"></span><strong>${tempLabel(highs[i])}</strong></div>
          <div class="rain-chance">💧 ${data.daily.precipitation_probability_max[i] ?? 0}%</div>`;
        els.daily.append(range);
      });
    }

    els.form.addEventListener('submit', async event => {
      event.preventDefault();
      const query = els.input.value.trim();
      if (!query) { els.input.focus(); return; }
      const id = ++requestId;
      els.status.className = '';
      els.status.textContent = 'Finding location…';
      els.content.classList.add('loading');
      try {
        const location = await geocode(query, id);
        if (!location || id !== requestId) return;
        await loadWeather(location);
      } catch (error) {
        if (id !== requestId) return;
        els.status.className = 'error';
        els.status.textContent = error.message || 'Location search failed.';
        els.content.classList.remove('loading');
      }
    });

    $('locate').addEventListener('click', () => {
      if (!navigator.geolocation) {
        els.status.className = 'error';
        els.status.textContent = 'Location is not supported by this browser.';
        return;
      }
      els.status.className = '';
      els.status.textContent = 'Getting your location…';
      navigator.geolocation.getCurrentPosition(
        position => loadWeather({ latitude: position.coords.latitude, longitude: position.coords.longitude, name: 'Your location' }, 'Your location'),
        () => { els.status.className = 'error'; els.status.textContent = 'Could not access location. Allow location access or search for a city.'; },
        { timeout: 10000 }
      );
    });

    document.querySelectorAll('[data-unit]').forEach(button => button.addEventListener('click', () => {
      unit = button.dataset.unit;
      document.querySelectorAll('[data-unit]').forEach(b => b.classList.toggle('active', b === button));
      if (lastWeather) render(lastWeather.data, lastWeather.location, lastWeather.label);
    }));

    loadWeather({ name: 'San Francisco', latitude: 37.7749, longitude: -122.4194 });
  </script>
</body>
</html>
