<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyTrack Style 3D Racer</title>
  <style>
    :root {
      --bg: #0d1624;
      --panel: rgba(14, 24, 34, 0.72);
      --text: #edf2ff;
      --muted: #a9bad0;
      --accent: #ffd166;
      --good: #68d391;
      --bad: #ef5d5d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#1a2c46, #091218 50%, #05070b);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#7eb7d8, #9ecae6 30%, #2f4d72 45%, #0e1c2a);
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 3;
    }

    .panel {
      min-width: 120px;
      padding: 10px 12px 8px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 25px rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
    }

    .label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }

    .value {
      margin-top: 3px;
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    #title {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: white;
      text-shadow: 0 4px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #title strong {
      display: block;
      font-size: 16px;
      font-weight: 900;
    }

    #title span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: #d3dded;
      letter-spacing: 0.22em;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(10, 18, 26, 0.76);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
    }

    #countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(56px, 10vw, 140px);
      font-weight: 900;
      color: white;
      text-shadow: 0 12px 28px rgba(0,0,0,0.4);
      letter-spacing: 0.08em;
      z-index: 4;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.18s ease;
    }

    @media (max-width: 700px) {
      #hud {
        top: 12px;
        left: 12px;
        gap: 8px;
      }
      .panel {
        padding: 8px 10px 6px;
        min-width: 96px;
      }
      .value {
        font-size: 15px;
      }
      #title {
        top: 12px;
        right: 12px;
      }
      #message {
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 9px 12px;
        white-space: normal;
        text-align: center;
        max-width: calc(100vw - 28px);
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <div class="label">Time</div>
      <div class="value" id="time">0:00.000</div>
    </div>
    <div class="panel">
      <div class="label">Best</div>
      <div class="value" id="best">--:--.---</div>
    </div>
    <div class="panel">
      <div class="label">Speed</div>
      <div class="value" id="speed">0 km/h</div>
    </div>
    <div class="panel">
      <div class="label">Check</div>
      <div class="value" id="check">0 / 3</div>
    </div>
  </div>

  <div id="title">
    <strong>Lowpoly lap</strong>
    <span>3D Time Trial</span>
  </div>

  <div id="countdown">3</div>
  <div id="message">Press W / ↑ to accelerate • R to restart</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa8d3ea);
    scene.fog = new THREE.Fog(0xa8d3ea, 60, 260);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 700);

    // Lighting
    const hemi = new THREE.HemisphereLight(0xecf7ff, 0x526c42, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff0d4, 2.8);
    sun.position.set(-40, 55, -18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -120;
    sun.shadow.camera.right = 120;
    sun.shadow.camera.top = 120;
    sun.shadow.camera.bottom = -120;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1500, 1500),
      new THREE.MeshStandardMaterial({ color: 0x4d8f55, roughness: 1, flatShading: true })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.7;
    ground.receiveShadow = true;
    scene.add(ground);

    // Track generation using a closed Catmull-Rom spline.
    const controlPoints = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 1.2, -55),
      new THREE.Vector3(32, 2.8, -100),
      new THREE.Vector3(80, 4.8, -120),
      new THREE.Vector3(140, 3.2, -90),
      new THREE.Vector3(170, 2.0, -20),
      new THREE.Vector3(140, 3.0, 40),
      new THREE.Vector3(80, 6.8, 90),
      new THREE.Vector3(30, 5.4, 115),
      new THREE.Vector3(10, 5.0, 170),
      new THREE.Vector3(-30, 8.0, 200),
      new THREE.Vector3(-90, 4.6, 180),
      new THREE.Vector3(-140, 1.6, 120),
      new THREE.Vector3(-170, 1.2, 30),
      new THREE.Vector3(-150, 0.8, -45),
      new THREE.Vector3(-115, 2.2, -95),
      new THREE.Vector3(-70, 7.0, -130),
      new THREE.Vector3(-30, 5.0, -150),
      new THREE.Vector3(0, 0, -105),
      new THREE.Vector3(0, 0, 0)
    ];

    const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal');
    const trackSamples = 1500;
    const trackPoints = curve.getPoints(trackSamples);
    const trackLength = curve.getLength();
    const trackFrames = curve.computeFrenetFrames(trackSamples, true);

    function makeRoadMesh() {
      const roadGroup = new THREE.Group();
      const roadWidth = 12;
      const vertices = [];
      const indices = [];

      for (let i = 0; i <= trackSamples; i++) {
        const point = trackPoints[i];
        const side = trackFrames.normals[i].clone();
        const a = point.clone().addScaledVector(side, roadWidth * 0.5);
        const b = point.clone().addScaledVector(side, -roadWidth * 0.5);
        a.y += 0.15;
        b.y += 0.15;
        vertices.push(a.x, a.y, a.z, b.x, b.y, b.z);

        if (i < trackSamples) {
          const base = i * 2;
          indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const road = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: 0x3b4047,
        roughness: 0.95,
        flatShading: true
      }));
      road.receiveShadow = true;
      roadGroup.add(road);

      // Road edges
      const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe9e0c0, roughness: 1, flatShading: true });
      for (let i = 0; i < trackSamples; i += 4) {
        const p = trackPoints[i];
        const side = trackFrames.normals[i].clone();
        const offset = side.clone().multiplyScalar(roadWidth * 0.52);
        const left = p.clone().add(offset);
        const right = p.clone().addScaledVector(side, -roadWidth * 0.52);
        const barLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 1.8), edgeMat);
        const barRight = barLeft.clone();
        barLeft.position.copy(left); barLeft.position.y += 0.2; barLeft.rotation.y = -Math.atan2(side.x, side.z);
        barRight.position.copy(right); barRight.position.y += 0.2; barRight.rotation.y = -Math.atan2(side.x, side.z);
        roadGroup.add(barLeft, barRight);
      }

      // Center line
      for (let i = 0; i < trackSamples; i += 12) {
        const p = trackPoints[i];
        const tangent = curve.getTangentAt(i / trackSamples).normalize();
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.12, 3.2),
          new THREE.MeshStandardMaterial({ color: 0xf8d567, emissive: 0xa67c00, emissiveIntensity: 0.25, flatShading: true })
        );
        line.position.copy(p).add(new THREE.Vector3(0, 0.2, 0));
        line.rotation.y = Math.atan2(tangent.x, tangent.z);
        roadGroup.add(line);
      }

      scene.add(roadGroup);
      return roadGroup;
    }

    const roadGroup = makeRoadMesh();

    // Hills and obstacles
    const hillMat = new THREE.MeshStandardMaterial({ color: 0x709c5d, roughness: 1, flatShading: true });
    for (let i = 0; i < 80; i++) {
      const t = (i / 80) * 0.9;
      const p = curve.getPointAt(t);
      const radius = 18 + (i % 9) * 7;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, 18 + (i % 6) * 4, 6), hillMat);
      const offset = new THREE.Vector3(Math.cos(i * 0.7), 0, Math.sin(i * 1.3)).multiplyScalar(radius);
      cone.position.copy(p).add(offset).add(new THREE.Vector3(0, 8, 0));
      cone.castShadow = true;
      cone.receiveShadow = true;
      scene.add(cone);
    }

    const treeMat1 = new THREE.MeshStandardMaterial({ color: 0x5b3f2d, roughness: 1, flatShading: true });
    const treeMat2 = new THREE.MeshStandardMaterial({ color: 0x2d763f, roughness: 1, flatShading: true });
    for (let i = 0; i < 120; i++) {
      const t = (i / 120) % 1;
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      const offset = side.multiplyScalar((i % 2 === 0 ? 1 : -1) * (11 + (i % 4) * 2));
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.35, 2.2, 5), treeMat1);
      trunk.position.y = 1.2;
      trunk.castShadow = true;
      tree.add(trunk);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.5, 5), i % 3 === 0 ? treeMat2 : new THREE.MeshStandardMaterial({ color: 0x397f4d, roughness: 1, flatShading: true }));
      crown.position.y = 4.2;
      crown.castShadow = true;
      tree.add(crown);
      tree.position.copy(p).add(offset);
      scene.add(tree);
    }

    // Ramps and boost pads.
    const rampGroup = new THREE.Group();
    scene.add(rampGroup);

    const rampT = [0.10, 0.22, 0.36, 0.49, 0.62, 0.78, 0.90];
    const ramps = [];
    const rampMat = new THREE.MeshStandardMaterial({ color: 0x53d4b6, roughness: 0.7, emissive: 0x1b7c68, emissiveIntensity: 0.2, flatShading: true });

    for (const t of rampT) {
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      const ramp = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, 12), rampMat);
      ramp.position.copy(p).addScaledVector(side, 0).add(new THREE.Vector3(0, 0.7, 0));
      ramp.rotation.y = Math.atan2(tangent.x, tangent.z);
      ramp.rotation.z = -0.28;
      ramp.receiveShadow = true;
      ramp.castShadow = true;
      rampGroup.add(ramp);
      ramps.push({ t, active: false });
    }

    // check points and finish arch.
    const checkPositions = [0.18, 0.42, 0.66, 0.88];
    const checkpoints = [];
    const archMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.8, emissive: 0x7a5110, emissiveIntensity: 0.2, flatShading: true });
    for (const t of checkPositions) {
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      const arch = new THREE.Group();
      const left = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, 0.5), archMat);
      const right = left.clone();
      left.position.copy(side.clone().multiplyScalar(4));
      right.position.copy(side.clone().multiplyScalar(-4));
      const beam = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.5, 0.5), archMat);
      beam.position.y = 3.5;
      arch.add(left, right, beam);
      arch.position.copy(p).add(new THREE.Vector3(0, 0.5, 0));
      arch.rotation.y = Math.atan2(tangent.x, tangent.z);
      scene.add(arch);
      checkpoints.push({ t, reached: false });
    }

    // Player car (low poly)
    const car = new THREE.Group();
    scene.add(car);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff5d5d, roughness: 0.7, flatShading: true });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x9ed9f8, roughness: 0.35, flatShading: true });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x1f222b, roughness: 0.85, flatShading: true });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xf5d66b, roughness: 0.8, emissive: 0x8b6600, emissiveIntensity: 0.2, flatShading: true });

    const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.72, 3.7), bodyMat);
    chassis.position.y = 0.8;
    chassis.castShadow = true;
    car.add(chassis);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.72, 1.7), glassMat);
    cabin.position.set(0, 1.45, 0.05);
    cabin.castShadow = true;
    car.add(cabin);

    const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.18, 0.9), accentMat);
    hood.position.set(0, 0.85, -1.85);
    car.add(hood);

    const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.16, 0.35), trimMat);
    spoiler.position.set(0, 1.35, 1.85);
    car.add(spoiler);

    const wheelGeo = new THREE.BoxGeometry(0.48, 0.7, 0.82);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x161c23, roughness: 0.9, flatShading: true });
    const wheelPositions = [
      [-1.0, 0.4, -1.15],
      [1.0, 0.4, -1.15],
      [-1.0, 0.4, 1.15],
      [1.0, 0.4, 1.15]
    ];
    const wheels = [];
    for (const [x, y, z] of wheelPositions) {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.position.set(x, y, z);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);
    }

    // start state
    const state = {
      progress: 0,
      speed: 0,
      lateral: 0,
      elapsed: 0,
      best: Number(localStorage.getItem('lowpoly-best') || 0),
      countdown: 3,
      running: false,
      lap: 0,
      checkpointIndex: 0,
      jump: 0,
      boost: 0,
      message: 'Ready'
    };

    const hud = {
      time: document.getElementById('time'),
      best: document.getElementById('best'),
      speed: document.getElementById('speed'),
      check: document.getElementById('check')
    };
    const countdownEl = document.getElementById('countdown');
    const messageEl = document.getElementById('message');

    const controls = new Set();
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
      controls.add(key);
      if (key === 'r') reset();
    });
    window.addEventListener('keyup', (e) => controls.delete(e.key.toLowerCase()));
    const pressed = (...keys) => keys.some(k => controls.has(k));

    function formatTime(value) {
      const minutes = Math.floor(value / 60);
      const seconds = value % 60;
      return `${minutes}:${seconds.toFixed(3).padStart(6, '0')}`;
    }

    function updateHud() {
      hud.time.textContent = formatTime(state.elapsed);
      hud.speed.textContent = `${Math.round(state.speed * 3.6)} km/h`;
      hud.check.textContent = `${state.checkpointIndex} / 3`;
      hud.best.textContent = state.best > 0 ? formatTime(state.best) : '--:--.---';
    }

    function reset() {
      state.progress = 0;
      state.speed = 0;
      state.elapsed = 0;
      state.lateral = 0;
      state.countdown = 3;
      state.running = false;
      state.checkpointIndex = 0;
      state.jump = 0;
      state.boost = 0;
      countdownEl.textContent = '3';
      countdownEl.style.opacity = '1';
      messageEl.textContent = 'Press W / ↑ to accelerate • R to restart';
      checkpoints.forEach(cp => cp.reached = false);
      updateHud();
    }

    function update(dt) {
      const forward = pressed('w', 'arrowup');
      const brake = pressed('s', 'arrowdown');
      const left = pressed('a', 'arrowleft');
      const right = pressed('d', 'arrowright');
      const drift = pressed(' ');

      if (!state.running) {
        state.countdown -= dt;
        const display = state.countdown > 2 ? '3' : state.countdown > 1 ? '2' : state.countdown > 0 ? '1' : 'GO';
        countdownEl.textContent = display;
        if (state.countdown <= 0) {
          state.running = true;
          countdownEl.style.opacity = '0';
          messageEl.textContent = 'Race the track';
        }
        return;
      }

      // speed control
      if (forward) {
        state.speed += 28 * dt;
      } else {
        state.speed -= 11 * dt;
      }
      if (brake) state.speed -= 22 * dt;
      state.speed = Math.max(0, Math.min(72, state.speed));

      // steering
      const steerInput = (right ? 1 : 0) - (left ? 1 : 0);
      state.lateral += steerInput * (0.85 + state.speed * 0.045) * dt * (drift ? 1.45 : 1.0);
      state.lateral *= Math.exp(-1.7 * dt);
      state.lateral = THREE.MathUtils.clamp(state.lateral, -5.6, 5.6);

      // progress along closed track
      state.progress += state.speed * dt * 1.7;
      if (state.progress > trackLength) {
        state.progress -= trackLength;
        state.lap += 1;
      }

      // ramp and boost triggers
      const progressT = state.progress / trackLength;
      let rampLift = 0;
      for (const ramp of ramps) {
        const dist = (progressT - ramp.t + 1) % 1;
        if (dist < 0.04 && state.speed > 18) {
          state.jump = Math.max(state.jump, 0.9);
          state.boost = 1;
        }
      }
      if (state.jump > 0) {
        state.jump = Math.max(0, state.jump - dt * 1.25);
        rampLift = Math.sin((1 - state.jump) * Math.PI) * 3.2;
      } else {
        state.boost = 0;
      }

      state.elapsed += dt;

      // checkpoints
      if (state.checkpointIndex < checkpoints.length) {
        const cp = checkpoints[state.checkpointIndex];
        const delta = ((progressT - cp.t + 1) % 1);
        if (delta < 0.08 || (delta > 0.92 && state.progress < 80)) {
          cp.reached = true;
          state.checkpointIndex += 1;
          messageEl.textContent = `Checkpoint ${state.checkpointIndex} / 3`;
          if (state.checkpointIndex === 3) {
            messageEl.textContent = 'Lap complete!';
          }
        }
      }

      // best time logic
      if (state.checkpointIndex >= 3 && state.progress < 20 && state.elapsed > 2) {
        if (!state.best || state.elapsed < state.best) {
          state.best = state.elapsed;
          localStorage.setItem('lowpoly-best', String(state.best));
        }
        state.checkpointIndex = 0;
        checkpoints.forEach(cp => cp.reached = false);
        messageEl.textContent = 'New best lap!';
      }

      const p = curve.getPointAt(progressT);
      const tangent = curve.getTangentAt(progressT).normalize();
      const right = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      const worldPosition = p.clone().addScaledVector(right, state.lateral).add(new THREE.Vector3(0, 1.1 + rampLift, 0));

      car.position.copy(worldPosition);
      const yaw = Math.atan2(tangent.x, tangent.z) + state.lateral * 0.04;
      car.rotation.set(0, yaw, -state.lateral * 0.08);

      const wheelSpin = state.speed * dt * 2.5;
      wheels.forEach(w => w.rotation.x -= wheelSpin);

      // camera follow
      const cameraTarget = worldPosition.clone().add(new THREE.Vector3(0, 2.3, 0));
      const cameraOffset = tangent.clone().multiplyScalar(-12).add(new THREE.Vector3(0, 5.2, 0));
      const cameraPos = worldPosition.clone().add(cameraOffset);
      camera.position.lerp(cameraPos, 1 - Math.exp(-6.5 * dt));
      camera.lookAt(cameraTarget);

      updateHud();
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      update(dt);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    updateHud();
    reset();
    animate();
  </script>
</body>
</html>
